name: Ping Backend Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -f https://chainskills-1.onrender.com/health
      - name: Log successful ping
        if: success()
        run: echo "Backend pinged successfully at $(date)"
      - name: Log failed ping
        if: failure()
        run: echo "Backend ping failed at $(date)"